# Verified local models (run on this computer through llama.cpp).
#
# This file drives the "Local" half of the "Models" tab. Nothing here is
# downloaded automatically: a model is fetched only when the user clicks
# Download on its card and confirms the size.
#
# Sizes and sha256 values were read from the Hugging Face API (metadata only) on
# 2026-11-19 at the revision recorded per build. They are re-verified after any
# download.
#
# Fields
#   families[].id / label / developer / license / summary
#   families[].brand_color     the developer's brand color (#rrggbb); tints the
#                          family's group in the model pickers
#   families[].primary_family  true on one family: listed first in the model
#                          pickers, with its group open
#   families[].status     verified | planned   (planned = shown as "coming soon";
#                          exact builds are added after they are confirmed)
#   families[].roles      which pipeline steps the family can serve: ocr, parse
#   builds[].id           stable id used in settings and API calls
#   builds[].params       parameter count label
#   builds[].quant        quantization label
#   builds[].hf_repo / hf_revision
#   builds[].files        model = language model file, mmproj = vision projector;
#                          size_bytes and sha256 per file
#   builds[].context_default   context window the engine is started with
#   builds[].tier         small | medium | large  (rough guidance for the UI)
#   builds[].default_for_test  true on the single build used for engine testing
#   builds[].inference.kv_bytes_per_token  f16 KV-cache bytes per context token
#                          (attention layers x KV heads x head size x 2 x 2), used
#                          when the engine picks GPUs and sizes the context.
#                          Models with sliding-window or linear-attention layers
#                          count only their full-attention layers (read from
#                          each GGUF header on 2026-11-19).
#   builds[].inference / families[].inference   optional engine settings (keys
#                          in vvl/llama/inference.py); a build's block overrides
#                          its family's key by key. Context, image token bounds,
#                          and server_args apply at the next engine start.
#                          Sampling, reasoning, and output length per request
#                          come from model_settings.json (vvl/generation.py).
#
# Builds are listed from least to most capable within a family; the
# `recommended` flag in /v1/models picks the most capable one that fits a GPU.

version: 1

families:
  - id: qwen3-vl
    label: Qwen3-VL
    brand_color: '#615CED'
    primary_family: true
    developer: Alibaba Qwen
    license: apache-2.0
    status: verified
    roles: [ocr, parse]
    summary: >-
      General-purpose vision-language model. Reads printed and handwritten
      label text and can also parse the transcription into structured fields.
    homepage: https://huggingface.co/Qwen
    # Engine settings for every Qwen3-VL build (keys: vvl/llama/inference.py).
    # Sampling, reasoning, and output length come from model_settings.json and
    # the user's choices on the VVL tab (vvl/generation.py).
    # 32B Q8 on one RTX 6000 Ada (Vulkan build): ~10 s OCR, ~24 s parse.
    inference:
      # Per request: image (up to image_max_tokens) + OCR prompt (~300) + reply
      # (ocr.max_tokens) must fit, and so must the parse prompt (~1,700 for
      # SLTPvM_default) + transcription + reply (parse.max_tokens).
      context_size: 8192
      # llama.cpp warns that Qwen-VL needs at least 1024 image tokens; 4096
      # (about 4 megapixels at 32x32 px per token) reads small label print.
      image_min_tokens: 1024
      image_max_tokens: 4096
      ocr:
        max_tokens: 3072
        image_first: true
      parse:
        max_tokens: 2048
    builds:
      - id: qwen3-vl-2b-q8
