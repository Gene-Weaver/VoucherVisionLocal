# Pinned llama.cpp engine.
#
# VoucherVisionLocal does not build or fork llama.cpp. It downloads one exact
# upstream release build, verifies every file against the sha256 recorded here,
# and runs its `llama-server` program.
#
# To move to a newer llama.cpp: regenerate this file from the GitHub release
# metadata for the new tag, run the engine tests, and commit the result.
#
# Fields
#   release.tag            upstream build tag
#   release.stable_alias   upstream stable release that points at this build
#   variants[]             one installable build per OS / CPU type / backend,
#                          listed in preference order within each OS + CPU type
#   variants[].requires    conditions for choosing the variant automatically
#                          (nvidia_driver_min = lowest NVIDIA driver version;
#                          glibc_min = lowest Linux C library version, e.g. 2.38
#                          means Ubuntu 24.04 or newer)
#   variants[].assets[]    files to download: kind `engine` (llama-server and its
#                          libraries) and, for CUDA builds, kind `runtime` (the
#                          NVIDIA CUDA runtime libraries that go beside it)
#
# sha256 values are the digests GitHub publishes for each release asset
# (read 2026-11-19).

