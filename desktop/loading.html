<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>VoucherVisionLocal</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; color: #333; text-align: center; }
  h1 { font-size: 1.5rem; margin: 18px 0 6px; }
  p { margin: 0 24px; color: #666; max-width: 560px; line-height: 1.45; }
  #step { margin-top: 14px; font-size: 0.92rem; color: #2e7d32; min-height: 1.3em; }
  .spinner { width: 38px; height: 38px; border-radius: 50%; border: 4px solid #ddd; border-top-color: #4caf50; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #e0e0e0; } p { color: #a8a8a8; } #step { color: #81c784; } .spinner { border-color: #333; border-top-color: #4caf50; } }
</style>
</head>
<body>
  <div class="spinner" role="status" aria-label="Starting"></div>
  <h1 id="title">Starting VoucherVisionLocal</h1>
  <p id="detail">The first start can take a minute.</p>
  <p id="step" aria-live="polite"></p>
</body>
</html>
