[project]
name = "vouchervision-local"
dynamic = ["version"]
description = "VoucherVisionLocal: run the VoucherVision OCR + label-parsing pipeline on your own computer, with a local llama.cpp engine or your own API keys."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    # web server
    "flask>=3.0",
    "waitress>=3.0",
    # HTTP clients (image fetching, provider calls, VVGO enrichment)
    "requests>=2.32",
    "httpx[http2]>=0.28",
    # images and PDFs
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "pymupdf>=1.24",
    # TextCollage label detector: LeafMachine3's archival detector (YOLO26x),
    # downloaded at first start. Core ML on macOS (Apple GPU), onnxruntime on
    # the CPU elsewhere (pymupdf needs onnxruntime too).
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20; sys_platform != 'darwin'",
    "coremltools>=9.0; sys_platform == 'darwin'",
    # prompts, config, records
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "openpyxl>=3.1",
    # system checker
    "psutil>=6.0",
    "py-cpuinfo>=9.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Optional local World Flora Online lookup (needs the 671 MB wfo_backbone.db download).
wfo = [
    "levenshtein>=0.25",
    "fuzzywuzzy>=0.18",
]

[project.scripts]
vvl = "vvl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]
# NEVER install this group into the environment (`uv sync --all-groups` would put
# onnxruntime-gpu next to onnxruntime: both own the `onnxruntime` package). It is
# here only so uv resolves and hash-pins the label detector's NVIDIA runtime:
# tools/lock_detector_gpu.py copies these wheels into
# vvl/registry/detector_gpu.lock.yaml, and the app downloads them into their own
# folder (vvl/detector_gpu.py). 1.26.0 is the newest CUDA 12 build (1.27 and later
# need CUDA 13 and an NVIDIA driver >= 580).
detector-gpu = [
    "onnxruntime-gpu[cuda,cudnn]==1.26.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    # cuDNN pulls in cuBLAS; 12.9.3.13 (the newest) has no Windows wheel.
    "nvidia-cublas-cu12==12.9.2.10; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["vvl", "textcollage"]
include = [
    "app.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
